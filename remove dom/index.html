<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color:aliceblue">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addlanguage(langname){
        const li=document.createElement('li');
        li.innerHTML=`${langname}`
        document.querySelector(".language").appendChild(li)


    }
    addlanguage("python")
    addlanguage("C++")

    function addoptlang(langname){
        const li=document.createElement('li');
        li.appendChild(document.createTextNode(langname))
        document.querySelector(".language").appendChild(li)

    }
    addoptlang("golang")

    //edit
    const seclang=document.querySelector("li:nth-child(2)")
    const newli=document.createElement('li')
    newli.textContent="Mojo"
    seclang.replaceWith(newli)

    //edit

    const firstlang=document.querySelector("li:nth-child(1)")
    newlang=document.createElement("li")
    newlang.textContent="typeScript"
    firstlang.replaceWith(newlang)

    
</script>
</html>
